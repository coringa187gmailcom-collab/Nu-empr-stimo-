<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18507501665"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}

    gtag("config", "AW-18507501665");

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova solicitação | CrediFácil Empréstimo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nu: { 50:'#F5F0FF',100:'#EDE5FF',200:'#D9C7FF',400:'#A855F7',500:'#9333EA',600:'#820AD1',700:'#6B00B3',800:'#580A8F',900:'#3B0764' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F7F7F8] min-h-screen antialiased font-sans">
  <nav class="nu-nav">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-2 text-slate-500 hover:text-nu-600 transition text-[13.5px] font-medium">
        <i class="fas fa-arrow-left text-xs"></i> Voltar
      </a>
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-nu-600 to-nu-800 flex items-center justify-center text-white font-extrabold text-xs tracking-tighter">CF</div>
        <span class="font-bold text-slate-900 text-[15px]">CrediFácil Empréstimo</span>
      </a>
      <div class="w-16"></div>
    </div>
  </nav>

  <main class="max-w-xl mx-auto px-4 py-10">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Nova solicitação</h1>
      <p class="text-slate-500 mt-2 text-[14px]">Preencha os dados abaixo. A análise é rápida.</p>
    </div>

    <div class="bg-white rounded-[1.5rem] shadow-xl shadow-slate-200/40 border border-slate-100 p-7 sm:p-9">
      <form id="applyForm" class="space-y-6" novalidate>
        <div>
          <label class="block text-[13px] font-medium text-slate-600 mb-1.5">Valor desejado (R$)</label>
          <input type="text" id="valor" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 focus:border-nu-500 outline-none transition text-lg font-semibold bg-slate-50/50" placeholder="5.000,00" value="5.000" />
          <p class="error-msg hidden text-red-500 text-xs mt-1.5"></p>
        </div>

        <div>
          <label class="block text-[13px] font-medium text-slate-600 mb-1.5">Número de parcelas</label>
          <select id="parcelas" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 focus:border-nu-500 outline-none bg-slate-50/50 font-medium">
            <option value="6">6x</option>
            <option value="12" selected>12x</option>
            <option value="18">18x</option>
            <option value="24">24x</option>
            <option value="36">36x</option>
            <option value="48">48x</option>
          </select>
        </div>

        <div class="border-t border-slate-100 pt-5">
          <p class="text-[13px] font-semibold text-slate-700 mb-4">Endereço</p>
          <div class="space-y-4">
            <div>
              <label class="block text-[13px] font-medium text-slate-600 mb-1.5">CEP</label>
              <input type="text" id="cep" required maxlength="9" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 focus:border-nu-500 outline-none bg-slate-50/50" placeholder="00000-000" />
              <p id="cepStatus" class="text-[12px] text-slate-400 mt-1.5 hidden"></p>
              <p class="error-msg hidden text-red-500 text-xs mt-1.5"></p>
            </div>
            <div class="grid sm:grid-cols-3 gap-4">
              <div class="sm:col-span-2">
                <label class="block text-[13px] font-medium text-slate-600 mb-1.5">Rua</label>
                <input type="text" id="rua" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 focus:border-nu-500 outline-none bg-slate-50/50" placeholder="Preenchido pelo CEP" />
                <p class="error-msg hidden text-red-500 text-xs mt-1.5"></p>
              </div>
              <div>
                <label class="block text-[13px] font-medium text-slate-600 mb-1.5">Número</label>
                <input type="text" id="numero" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 focus:border-nu-500 outline-none bg-slate-50/50" placeholder="123" />
                <p class="error-msg hidden text-red-500 text-xs mt-1.5"></p>
              </div>
            </div>
            <div>
              <label class="block text-[13px] font-medium text-slate-600 mb-1.5">Cidade</label>
              <input type="text" id="cidade" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 focus:border-nu-500 outline-none bg-slate-50/50" placeholder="Preenchido pelo CEP" />
              <p class="error-msg hidden text-red-500 text-xs mt-1.5"></p>
            </div>
            <input type="hidden" id="bairro" />
            <input type="hidden" id="uf" />
            <input type="hidden" id="complemento" />
          </div>
        </div>

        <div class="bg-gradient-to-br from-nu-50 to-purple-50 rounded-2xl p-5 space-y-3 border border-nu-100/50">
          <div class="flex justify-between text-[13.5px]">
            <span class="text-slate-500">Parcela estimada</span>
            <span class="font-bold text-slate-900" id="previewParcela">R$ 489,90</span>
          </div>
          <div class="flex justify-between text-[13.5px]">
            <span class="text-slate-500">Total estimado</span>
            <span class="font-bold text-slate-900" id="previewTotal">R$ 5.878,80</span>
          </div>
          <div class="flex justify-between text-[13.5px]">
            <span class="text-slate-500">Taxa aproximada</span>
            <span class="font-medium text-slate-700">2,49% a.m.</span>
          </div>
          <p class="text-[11px] text-slate-400 pt-1">* Valores sujeitos à análise de crédito.</p>
        </div>

        <div>
          <label class="block text-[13px] font-medium text-slate-600 mb-1.5">Finalidade (opcional)</label>
          <select id="finalidade" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 outline-none bg-slate-50/50">
            <option value="">Selecione...</option>
            <option value="pessoal">Despesas pessoais</option>
            <option value="dividas">Quitação de dívidas</option>
            <option value="reforma">Reforma / casa</option>
            <option value="veiculo">Veículo</option>
            <option value="educacao">Educação</option>
            <option value="outros">Outros</option>
          </select>
        </div>

        <div>
          <label class="block text-[13px] font-medium text-slate-600 mb-1.5">Chave Pix / Conta para recebimento</label>
          <input type="text" id="conta" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 focus:border-nu-500 outline-none transition bg-slate-50/50" placeholder="CPF, e-mail, telefone ou chave aleatória" />
          <p class="error-msg hidden text-red-500 text-xs mt-1.5"></p>
        </div>

        <div class="flex items-start gap-3">
          <input type="checkbox" id="confirm" required class="mt-1 rounded border-slate-300 text-nu-600 focus:ring-nu-500" />
          <label for="confirm" class="text-[13px] text-slate-500 leading-relaxed">
            Declaro que as informações são verdadeiras e autorizo a consulta aos birôs de crédito.
          </label>
        </div>

        <button type="submit" class="nu-btn-primary w-full text-[15px] py-4 flex items-center justify-center gap-2">
          <i class="fas fa-paper-plane text-sm"></i> Enviar solicitação
        </button>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const session = getSession();
    if (!session) window.location.href = 'login.html';

    function calcPreview() {
      const valor = parseFloat(document.getElementById('valor').value.replace(/\D/g, '')) || 0;
      const parcelas = parseInt(document.getElementById('parcelas').value) || 12;
      const taxa = 0.0249;
      if (valor < 5000) {
        document.getElementById('previewParcela').textContent = '—';
        document.getElementById('previewTotal').textContent = '—';
        return;
      }
      const parcela = valor * (taxa * Math.pow(1 + taxa, parcelas)) / (Math.pow(1 + taxa, parcelas) - 1);
      document.getElementById('previewParcela').textContent = 'R$ ' + parcela.toFixed(2).replace('.', ',');
      document.getElementById('previewTotal').textContent = 'R$ ' + (parcela * parcelas).toFixed(2).replace('.', ',');
    }

    document.getElementById('valor').addEventListener('input', function() {
      let v = this.value.replace(/\D/g, '');
      this.value = v ? Number(v).toLocaleString('pt-BR') : '';
      calcPreview();
    });
    document.getElementById('parcelas').addEventListener('change', calcPreview);
    calcPreview();

    let cepValido = false;

    function validarFormatoCep(cep) {
      const d = String(cep || '').replace(/\D/g, '');
      if (d.length !== 8) return false;
      if (/^(\d)\1+$/.test(d)) return false; // 00000000, 11111111...
      return true;
    }

    document.getElementById('cep').addEventListener('input', function() {
      let v = this.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
      this.value = v;
      cepValido = false;
      const status = document.getElementById('cepStatus');
      status.classList.add('hidden');
      if (v.replace(/\D/g, '').length === 8) {
        if (!validarFormatoCep(v)) {
          status.classList.remove('hidden');
          status.classList.add('text-red-500');
          status.textContent = 'CEP inválido';
          return;
        }
        buscarCep(v);
      }
    });

    async function buscarCep(cep) {
      const status = document.getElementById('cepStatus');
      status.classList.remove('hidden', 'text-red-500', 'text-emerald-600');
      status.classList.add('text-slate-400');
      status.textContent = 'Validando CEP...';
      cepValido = false;
      try {
        const res = await fetch('https://viacep.com.br/ws/' + cep.replace(/\D/g, '') + '/json/');
        const data = await res.json();
        if (data.erro || !data.localidade) {
          status.classList.add('text-red-500');
          status.textContent = 'CEP não encontrado. Verifique o número.';
          return;
        }
        if (data.logradouro) document.getElementById('rua').value = data.logradouro;
        if (data.localidade) document.getElementById('cidade').value = data.localidade;
        if (data.bairro) document.getElementById('bairro').value = data.bairro;
        if (data.uf) document.getElementById('uf').value = data.uf;
        cepValido = true;
        status.classList.add('text-emerald-600');
        status.textContent = 'CEP válido' + (data.bairro ? ' · ' + data.bairro + '/' + data.uf : '');
      } catch {
        status.classList.add('text-red-500');
        status.textContent = 'Não foi possível validar o CEP. Tente novamente.';
      }
    }

    document.getElementById('applyForm').addEventListener('submit', function(e) {
      e.preventDefault();
      clearErrors(this);
      const valorStr = document.getElementById('valor').value.replace(/\D/g, '');
      const valor = parseFloat(valorStr) || 0;
      const parcelas = parseInt(document.getElementById('parcelas').value);
      const conta = document.getElementById('conta').value.trim();
      const finalidade = document.getElementById('finalidade').value;
      const confirm = document.getElementById('confirm').checked;
      const cep = document.getElementById('cep').value.trim();
      const rua = document.getElementById('rua').value.trim();
      const numero = document.getElementById('numero').value.trim();
      const complemento = document.getElementById('complemento').value.trim();
      const bairro = document.getElementById('bairro').value.trim();
      const cidade = document.getElementById('cidade').value.trim();
      const uf = document.getElementById('uf').value;
      let valid = true;
      if (valor < 5000 || valor > 50000) { showError(document.getElementById('valor'), 'Valor entre R$ 5.000 e R$ 50.000'); valid = false; }
      if (!conta) { showError(document.getElementById('conta'), 'Informe a chave Pix ou dados da conta'); valid = false; }
      if (!validarFormatoCep(cep)) { showError(document.getElementById('cep'), 'CEP inválido'); valid = false; }
      else if (!cepValido) { showError(document.getElementById('cep'), 'CEP não confirmado. Aguarde a validação ou corrija.'); valid = false; }
      if (rua.length < 3) { showError(document.getElementById('rua'), 'Informe a rua'); valid = false; }
      if (!numero) { showError(document.getElementById('numero'), 'Informe o número'); valid = false; }
      if (cidade.length < 2) { showError(document.getElementById('cidade'), 'Informe a cidade'); valid = false; }
      if (!confirm) { alert('Você precisa autorizar a consulta de crédito.'); valid = false; }
      if (!valid) return;

      const taxa = 0.0249;
      const parcela = valor * (taxa * Math.pow(1 + taxa, parcelas)) / (Math.pow(1 + taxa, parcelas) - 1);
      const loan = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        valor, parcelas,
        parcela: Math.round(parcela * 100) / 100,
        total: Math.round(parcela * parcelas * 100) / 100,
        finalidade: finalidade || 'não informada',
        conta, status: 'em_analise',
        endereco: { cep, rua, numero, complemento, bairro, cidade, uf },
        createdAt: new Date().toISOString()
      };

      const users = JSON.parse(localStorage.getItem('credifacil_users') || '[]');
      const idx = users.findIndex(u => u.id === session.id);
      if (idx === -1) { window.location.href = 'login.html'; return; }
      if (!users[idx].loans) users[idx].loans = [];
      users[idx].loans.push(loan);
      localStorage.setItem('credifacil_users', JSON.stringify(users));

      // Grava no servidor para o admin ver o endereço
      fetch((window.location.origin) + '/api/admin/loan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: session.id, email: session.email, loan })
      }).catch(() => {});

      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

      setTimeout(() => {
        btn.innerHTML = '<i class="fas fa-check"></i> Pedido enviado!';
        btn.classList.remove('nu-btn-primary');
        btn.classList.add('bg-emerald-600', 'text-white', 'rounded-xl', 'font-semibold');
        const msg = document.createElement('div');
        msg.className = 'mt-4 p-4 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-800 text-[14px] leading-relaxed text-center';
        msg.innerHTML = '<strong>Pedido recebido.</strong><br>Após a análise, um dos nossos representantes entrará em contato para informar o resultado.';
        this.appendChild(msg);
        setTimeout(() => window.location.href = 'dashboard.html', 2800);
      }, 800);
    });
  </script>
</body>
</html>
