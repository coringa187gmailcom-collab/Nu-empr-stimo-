<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar WhatsApp | CrediFácil Empréstimo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nu: { 50:'#F5F0FF',100:'#EDE5FF',400:'#A855F7',500:'#9333EA',600:'#820AD1',700:'#6B00B3',800:'#580A8F' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F7F7F8] min-h-screen flex flex-col antialiased font-sans">
  <nav class="nu-nav">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-nu-600 to-nu-800 flex items-center justify-center text-white font-extrabold text-sm shadow-lg shadow-nu-600/25 tracking-tighter">CF</div>
        <span class="text-[17px] font-bold tracking-tight text-slate-900">CrediFácil Empréstimo</span>
      </a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div id="formState" class="bg-white rounded-[1.5rem] shadow-xl border border-slate-100 p-8 sm:p-10 text-center">
        <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl mx-auto mb-5">
          <i class="fab fa-whatsapp"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">Confirme seu WhatsApp</h1>
        <p class="mt-2 text-slate-500 text-[14px]">
          Enviamos um código de 6 dígitos para<br>
          <strong id="waLabel" class="text-slate-700">seu WhatsApp</strong>
        </p>

        <div id="simBox" class="hidden mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-[13px] text-amber-900">
          Modo simulado — use o código: <strong id="simCode" class="tracking-widest"></strong>
        </div>

        <div class="mt-8">
          <label class="block text-[13px] font-medium text-slate-600 mb-2 text-left">Código</label>
          <input type="text" id="codeInput" maxlength="6" inputmode="numeric" pattern="[0-9]*"
            class="w-full text-center text-2xl font-bold tracking-[0.4em] py-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-nu-500/30 focus:border-nu-500 outline-none"
            placeholder="000000" autocomplete="one-time-code" />
        </div>

        <p id="errorMsg" class="hidden mt-3 text-red-500 text-sm"></p>

        <button type="button" id="confirmBtn" class="nu-btn-primary w-full mt-6 py-3.5 text-[15px]">
          Confirmar
        </button>

        <button type="button" id="resendBtn" class="mt-4 text-[13px] font-semibold text-nu-600 hover:underline">
          Reenviar código
        </button>
        <p id="resendMsg" class="hidden mt-2 text-[12px] text-slate-500"></p>
      </div>

      <div id="successState" class="hidden bg-white rounded-[1.5rem] shadow-xl border border-slate-100 p-10 text-center">
        <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl mx-auto mb-5">
          <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">WhatsApp confirmado!</h1>
        <p class="mt-2 text-slate-500 text-[14px]" id="successMsg">Sua conta está ativa. Você já pode entrar.</p>
        <a href="login.html" class="nu-btn-primary inline-flex items-center gap-2 mt-8 px-6 py-3.5 text-[15px]">
          Fazer login <i class="fas fa-arrow-right text-xs"></i>
        </a>
      </div>
    </div>
  </main>

  <script>
    const API = window.location.origin;
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || sessionStorage.getItem('nu_pending_email') || '';
    const whatsapp = params.get('whatsapp') || sessionStorage.getItem('nu_pending_whatsapp') || '';
    const simCode = params.get('code') || sessionStorage.getItem('nu_pending_code') || '';

    if (whatsapp) {
      document.getElementById('waLabel').textContent = whatsapp;
    }
    if (simCode) {
      document.getElementById('simBox').classList.remove('hidden');
      document.getElementById('simCode').textContent = simCode;
    }

    document.getElementById('codeInput').addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '').slice(0, 6);
    });

    document.getElementById('confirmBtn').addEventListener('click', async function() {
      const code = document.getElementById('codeInput').value.trim();
      const err = document.getElementById('errorMsg');
      err.classList.add('hidden');

      if (code.length !== 6) {
        err.textContent = 'Digite o código de 6 dígitos';
        err.classList.remove('hidden');
        return;
      }

      this.disabled = true;
      this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Confirmando...';

      try {
        const res = await fetch(API + '/api/verify-whatsapp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, whatsapp, code })
        });
        const data = await res.json();
        if (!res.ok) {
          err.textContent = data.error || 'Código inválido';
          err.classList.remove('hidden');
          this.disabled = false;
          this.textContent = 'Confirmar';
          return;
        }
        sessionStorage.removeItem('nu_pending_code');
        document.getElementById('formState').classList.add('hidden');
        document.getElementById('successState').classList.remove('hidden');
        if (data.name) {
          document.getElementById('successMsg').textContent =
            'Olá, ' + data.name.split(' ')[0] + '! Sua conta está ativa.';
        }
      } catch {
        err.textContent = 'Erro de conexão com o servidor';
        err.classList.remove('hidden');
        this.disabled = false;
        this.textContent = 'Confirmar';
      }
    });

    document.getElementById('resendBtn').addEventListener('click', async function() {
      this.disabled = true;
      const msg = document.getElementById('resendMsg');
      msg.classList.remove('hidden');
      msg.textContent = 'Enviando...';
      try {
        const res = await fetch(API + '/api/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, whatsapp })
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = data.message || 'Código reenviado';
          if (data.simulated && data.code) {
            document.getElementById('simBox').classList.remove('hidden');
            document.getElementById('simCode').textContent = data.code;
            sessionStorage.setItem('nu_pending_code', data.code);
          }
        } else {
          msg.textContent = data.error || 'Falha ao reenviar';
        }
      } catch {
        msg.textContent = 'Erro de conexão';
      }
      this.disabled = false;
    });
  </script>
</body>
</html>
