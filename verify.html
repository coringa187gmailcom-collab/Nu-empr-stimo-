<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar e-mail | NU Empréstimo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nu: { 50:'#F5F0FF',100:'#EDE5FF',400:'#A855F7',500:'#9333EA',600:'#820AD1',700:'#6B00B3',800:'#580A8F' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F7F7F8] min-h-screen flex flex-col antialiased font-sans">
  <nav class="nu-nav">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-nu-600 to-nu-800 flex items-center justify-center text-white font-extrabold text-sm shadow-lg shadow-nu-600/25 tracking-tighter">NU</div>
        <span class="text-[17px] font-bold tracking-tight text-slate-900">Empréstimo</span>
      </a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md text-center">
      <div id="loadingState" class="bg-white rounded-[1.5rem] shadow-xl border border-slate-100 p-10">
        <div class="w-14 h-14 rounded-2xl bg-nu-100 text-nu-600 flex items-center justify-center text-2xl mx-auto mb-5">
          <i class="fas fa-spinner fa-spin"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">Confirmando seu e-mail...</h1>
        <p class="mt-2 text-slate-500 text-[14px]">Aguarde um momento</p>
      </div>

      <div id="successState" class="hidden bg-white rounded-[1.5rem] shadow-xl border border-slate-100 p-10">
        <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl mx-auto mb-5">
          <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">E-mail confirmado!</h1>
        <p class="mt-2 text-slate-500 text-[14px]" id="successMsg">Sua conta está ativa. Você já pode entrar.</p>
        <a href="login.html" class="nu-btn-primary inline-flex items-center gap-2 mt-8 px-6 py-3.5 text-[15px]">
          Fazer login <i class="fas fa-arrow-right text-xs"></i>
        </a>
      </div>

      <div id="errorState" class="hidden bg-white rounded-[1.5rem] shadow-xl border border-slate-100 p-10">
        <div class="w-14 h-14 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center text-2xl mx-auto mb-5">
          <i class="fas fa-times-circle"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">Não foi possível confirmar</h1>
        <p class="mt-2 text-slate-500 text-[14px]" id="errorMsg">Link inválido ou expirado.</p>
        <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
          <a href="register.html" class="nu-btn-primary px-5 py-3 text-[14px]">Criar nova conta</a>
          <a href="login.html" class="bg-white border border-slate-200 text-slate-700 font-semibold px-5 py-3 rounded-xl text-[14px] hover:bg-slate-50 transition">Ir para login</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API = window.location.origin;

    (async function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        showError('Link de confirmação incompleto. Solicite um novo e-mail.');
        return;
      }

      try {
        const res = await fetch(API + '/api/verify?token=' + encodeURIComponent(token));
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Não foi possível confirmar o e-mail.');
          return;
        }

        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('successState').classList.remove('hidden');
        if (data.name) {
          document.getElementById('successMsg').textContent =
            `Olá, ${data.name.split(' ')[0]}! Sua conta está ativa. Você já pode entrar.`;
        }
      } catch (err) {
        showError('Erro de conexão. Verifique se o servidor está rodando e tente novamente.');
      }
    })();

    function showError(msg) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMsg').textContent = msg;
    }
  </script>
</body>
</html>
